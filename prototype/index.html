<!doctype html>
<html lang="nl" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Huis in beeld — ontwerp prototype</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="prototype-controls" aria-label="Prototype-instellingen">
      <label>
        Fixture
        <select id="fixture-select">
          <option value="warning">Waarschuwing</option>
          <option value="normal">Normaal</option>
          <option value="unavailable">Unavailable</option>
        </select>
      </label>
      <button id="theme-toggle" type="button">Donkere modus</button>
    </div>

    <div class="app-shell">
      <aside class="sidebar" aria-label="Home Assistant-navigatie">
        <a class="brand" href="?view=home" aria-label="Home Assistant">
          <span class="brand-mark" aria-hidden="true">HA</span>
          <span><strong>Home Assistant</strong><small>Native applicatieshell</small></span>
        </a>
        <nav id="ha-nav" class="side-nav"></nav>
        <div class="sidebar-footer">
          <span class="avatar" aria-hidden="true">JB</span>
          <span><strong>Profiel</strong><small>Home Assistant</small></span>
          <span class="online-dot" title="Verbonden"></span>
        </div>
      </aside>

      <main class="app-main">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="page-eyebrow">Vrijdag 21 augustus</p>
            <h1 id="page-title">Goedenavond</h1>
          </div>
          <div class="context-chips" id="context-chips" aria-label="Woningcontext"></div>
        </header>
        <nav id="view-tabs" class="view-tabs" aria-label="Dashboardweergaven"></nav>
        <div id="page" class="page" aria-live="polite"></div>
      </main>
    </div>

    <script src="fixtures.js"></script>
    <script src="app.js"></script>
  </body>
</html>
